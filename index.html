  points.forEach(p => {
  const div = document.createElement("div");
  div.className = "point";
  div.style.top = p.top + "px";
  div.style.left = p.left + "px";
  div.style.width = p.size + "px";
  div.style.height = p.size + "px";
  div.style.fontSize = (p.size * 0.6) + "px"; // ขนาดตัวเลขตามวงกลม
  div.innerText = p.id;
  div.onclick = () => showInfo(p.id);
  mapContainer.appendChild(div);
});

  function showInfo(id) {
    const popup = document.getElementById("popup");
    const text = document.getElementById("popup-text");
    text.innerText = "จุดที่ " + id + ": " + (places[id] || "ยังไม่มีข้อมูล");
    popup.classList.add("show");
  }

  function closePopup() {
    const popup = document.getElementById("popup");
    popup.classList.remove("show");
    
  }
