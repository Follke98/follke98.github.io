    .point {
      position: absolute;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #4f46e5 60%, #f43f5e 100%);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 12px 2px #6366f1a0;
      border: 2px solid #fff;
      transition: transform 0.18s, box-shadow 0.18s;
      z-index: 2;
    }
    .point:hover {
      transform: scale(1.18);
      box-shadow: 0 0 24px 6px #f43f5e80;
      background: linear-gradient(135deg, #f43f5e 60%, #4f46e5 100%);
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: linear-gradient(135deg, #fff 80%, #e0e7ff 100%);
      padding: 28px 32px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(60,60,120,0.22);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      min-width: 220px;
      font-size: 1.15em;
      color: #2d2d2d;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
    }
    .popup.show {
      pointer-events: auto;
      opacity: 1;
